# Template für Zukunftstage Server
# Kopieren und anpassen:
#   cp docker-compose.template.yaml mein-workshop.yaml
#
# Dann anpassen:
#   - WORLDNAME: Name des Weltordners (z.B. "02-koeln")
#   - Port: Einzigartiger Port für diesen Workshop
#   - Volume: Pfad zum Weltverzeichnis
#
# Starten mit: docker compose -f mein-workshop.yaml up -d

services:
  luanti:
    image: zukunftstage-server:latest
    container_name: zfn_WORLDNAME  # Anpassen!
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      - CLI_ARGS=--worldname WORLDNAME --port 30000 --logfile /config/.minetest/logs/WORLDNAME.log
    volumes:
      # Weltverzeichnis mounten (enthält world2minetest/map.dat)
      - ./worlds/WORLDNAME:/config/.minetest/worlds/WORLDNAME
    ports:
      - "30000:30000/udp"  # Port anpassen!
    restart: unless-stopped
